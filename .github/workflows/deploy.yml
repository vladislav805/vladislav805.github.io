name: Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy_ghp:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist

  deploy_host:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy
        uses: D3rHase/rsync-deploy-action@latest
        with:
          REPOSITORY_PATH: dist/
          USER: vlad805
          HOST: '135.181.147.70'
          SERVER_PATH: /home/vlad805/projects/veluga/
          PRIVATE_SSH_KEY: ${{ secrets.ssh_key }}
